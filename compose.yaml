name: find-bike-routes

services:
  database:
    image: mobilitydb/mobilitydb:16-3.5-1.3
    platform: linux/amd64
    environment:
      POSTGRES_DB: bike_routes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BIKE_ROUTES_IMPORT_PASSWORD: ${BIKE_ROUTES_IMPORT_PASSWORD:?set BIKE_ROUTES_IMPORT_PASSWORD}
      BIKE_ROUTES_API_PASSWORD: ${BIKE_ROUTES_API_PASSWORD:?set BIKE_ROUTES_API_PASSWORD}
    ports:
      - "${MOBILITYDB_PORT:-5432}:5432"
    volumes:
      - mobilitydb-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc
          "SELECT count(*) FROM pg_extension WHERE extname IN ('postgis', 'mobilitydb')")" = 2
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mobilitydb-data:
